<!doctype html><html><head><meta charset="utf-8"><script src="../vendor/qrcode-generator.js"></script>
<style>
@page{size:210mm 297mm;margin:0}
html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#1B232B}
.folha{width:210mm;height:297mm;position:relative}
.f{position:absolute;left:0;width:210mm;height:148.5mm;box-sizing:border-box;padding:8mm 10mm 6mm;display:grid;grid-template-columns:1fr 50mm;grid-template-rows:auto 1fr auto;column-gap:7mm}
.f.b{top:148.5mm}
.corte{position:absolute;left:0;right:0;top:148.5mm;border-top:.3mm dashed #8A8C82}
.corte span{position:absolute;right:6mm;top:-2.4mm;background:#fff;padding:0 1.5mm;font-size:7pt;color:#8A8C82}
.topo{grid-column:1/-1;display:flex;align-items:center;gap:4mm;border-bottom:.8mm solid #84BD00;padding-bottom:2.5mm;margin-bottom:3mm}
.topo img{height:11mm}
.topo h1{margin:0;font-size:17pt;line-height:1.05;letter-spacing:.2pt}
.topo p{margin:.8mm 0 0;font-size:9.5pt;color:#51534A}
ol{margin:0;padding:0;list-style:none;counter-reset:p;font-size:12pt;line-height:1.32}
ol li{counter-increment:p;position:relative;padding-left:9mm;margin-bottom:2.6mm}
ol li::before{content:counter(p);position:absolute;left:0;top:-.3mm;width:6mm;height:6mm;border-radius:50%;background:#84BD00;color:#1B232B;font-weight:700;font-size:10pt;display:grid;place-items:center;border:.25mm solid #1B232B;box-sizing:border-box}
ol li b{color:#1B232B}
.menu{font-size:10pt;color:#51534A;margin-top:.6mm}
.dicas{margin-top:2.5mm;border:.3mm solid #C9CCC3;border-left:1.6mm solid #744F28;border-radius:1.5mm;padding:2mm 3mm;font-size:10pt;line-height:1.4}
.dicas p{margin:0 0 .8mm}
.lado{display:flex;flex-direction:column;gap:3mm;align-items:center}
.qr{text-align:center}
.qr svg{width:39mm;height:39mm;display:block;margin:0 auto}
.qr b{display:block;font-size:9.5pt;margin-top:.6mm}
.qr small{display:block;font-size:7.5pt;color:#51534A}
.pe{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-top:2mm;padding-top:2mm;border-top:.3mm solid #E2E4DE;font-size:8.5pt}
.pe .duv{background:#84BD00;font-weight:700;padding:1.2mm 3mm;border-radius:1.2mm}
.lop{display:flex;align-items:center;gap:2mm}
.lop img{height:7mm}
.lop .barra{width:.25mm;align-self:stretch;background:#C9CCC3}
.lop .nome{display:flex;flex-direction:column;line-height:1.1}
.lop .nome b{font-size:9pt}
.lop .nome small{font-size:7pt;color:#51534A}
.end{display:block;font-family:"Courier New",monospace;font-weight:700;font-size:9.6pt;white-space:nowrap;color:#1B232B;margin-top:.5mm}
</style></head><body><div class="folha" id="folha"></div>
<script>
const URL='https://sakuma-agro.github.io/gestao-rapida-pessoas/consulta/';
const svg=t=>{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:8,margin:1,scalable:true});};
const um=c=>`<section class="f ${c}">
 <div class="topo"><img src="../img/sakuma-logo.png" alt="SAKUMA"><div><h1>COMO ACESSAR OS DOCUMENTOS DA FAZENDA</h1><p>Pelo celular · sem senha · só para consulta</p></div></div>
 <div>
  <ol>
   <li>Abra a <b>câmera</b> do celular.</li>
   <li>Aponte para o <b>QR Code</b> (do quadro de avisos ou deste folheto) e espere aparecer o link.</li>
   <li>Toque no link. Abre a página <b>Gestão Rápida – Consulta de documentos</b>.</li>
   <li>Toque no que precisa:
     <div class="menu">Procedimentos (POPs) · Políticas · Leis trabalhistas · FISPQ / FDS · Telefones úteis · Mapa até o pronto-socorro</div></li>
   <li>Para voltar, toque na seta <b>‹</b> no alto da tela.</li>
  </ol>
  <div class="dicas">
   <p><b>FISPQ:</b> digite o nome do produto na busca e toque na ficha.</p>
   <p><b>Guarde no celular:</b> no Chrome, toque em <b>⋮</b> e depois em <b>Adicionar à tela inicial</b>.</p>
   <p><b>A câmera não leu?</b> Digite no navegador: <span class="end">sakuma-agro.github.io/gestao-rapida-pessoas/consulta</span></p>
   <p style="margin:0">Precisa de internet (Wi-Fi ou dados móveis).</p>
  </div>
 </div>
 <div class="lado">
  <div class="qr">${svg(URL)}<b>Documentos</b><small>POPs, políticas, leis, telefones</small></div>
  <div class="qr">${svg(URL+'?g=fds')}<b>FISPQ / FDS</b><small>Fichas de segurança</small></div>
 </div>
 <div class="pe"><span class="duv">Dúvidas: administrativo (34) 9 9646-3296</span>
  <span class="lop"><img src="../img/lop-marca-limpa.v1.png" alt="LOP"><span class="barra"></span><span class="nome"><b>Gestão Rápida</b><small>Inteligência para o agronegócio</small></span></span></div>
</section>`;
document.getElementById('folha').innerHTML=um('a')+'<div class="corte"><span>✂ cortar aqui</span></div>'+um('b');
Promise.all([...document.images].map(i=>i.complete?1:new Promise(o=>i.onload=o))).then(()=>window.pronto=1);
</script></body></html>
