<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"></head>
<body><main style="padding:16px"><section class="tela" id="telaSstNrs"></section></main>
<script type="module">
import { estado } from './js/store.js';
import { abrirNrs } from './js/sst-nrs.js';
let banco = [], rodada = 0;
const g = 'https://www.gov.br/x/';
const resp = () => ({ nrs: [
  { nr: 31, ok: true, titulo: 'NR-31 - AGRICULTURA', pagina: g+'nr-31', texto_pdf: g+'nr-31-atualizada-2024-2.pdf', texto_ano: 2024, atualizado_portal: rodada>1 ? '2026-10-28' : '2025-10-24', ultima_portaria: 'Portaria SIT nº 1.086', ultima_portaria_link: g+'p.pdf', portarias: [{ano:2018,texto:'Portaria MTb nº 1.086',link:g+'a.pdf'},{ano:2005,texto:'Portaria 86',link:g+'b.pdf',revogada:true}] },
  { nr: 10, ok: true, titulo: 'NR-10', pagina: g+'nr-10', texto_pdf: g+'nr-10-atualizada-2026-1.pdf', texto_ano: 2026, atualizado_portal: '2026-08-06', ultima_portaria: 'Portaria MTE nº 737, de 29 de maio de 2026', ultima_portaria_link: g+'737.pdf', portarias: [] },
  { nr: 39, ok: true, titulo: 'NR-39 - TESTE NOVA', pagina: g+'nr-39', texto_pdf: null, atualizado_portal: '2026-10-01', portarias: [] },
  { nr: 12, ok: false, motivo: 'portal respondeu 500' },
]});
const tabela = { select(){return this}, order(){ return Promise.resolve({ data: banco, error: null }); }, upsert(rows){ banco = rows.map(r=>({...r})); return Promise.resolve({ error: null }); } };
estado.sessao = { user: { email: 'teste@x' } };
estado.cliente = { from: () => tabela, functions: { invoke: async () => { rodada++; await new Promise(r=>setTimeout(r,300)); return { data: resp(), error: null }; } } };
window.rodar = () => document.getElementById('nrAtualizar').click();
await abrirNrs();
</script></body></html>
